apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  labels: {app: payment}
spec:
  replicas: 1
  selector:
    matchLabels: {app: payment}
  template:
    metadata:
      labels:
        {{- include "dbrcl.podLabels" (dict "root" . "app" "payment" "service" "payment" "version" .Values.image.tag) | nindent 8 }}
      annotations:
        {{- include "dbrcl.scrape" 8080 | nindent 8 }}
    spec:
      containers:
        - name: payment
          image: {{ include "dbrcl.image" (dict "root" . "name" "payment") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: PAYMENT_LATENCY_MS, value: {{ .Values.payment.latencyMs | quote }}}
            - {name: PAYMENT_JITTER_MS, value: {{ .Values.payment.jitterMs | quote }}}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          resources:
            {{- toYaml .Values.payment.resources | nindent 12 }}
          {{- include "dbrcl.securityContext" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  labels: {app: payment}
spec:
  selector: {app: payment}
  ports:
    - {name: http, port: 8080, targetPort: http}
