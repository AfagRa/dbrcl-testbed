# dbrcl-testbed: single source of truth for every tunable parameter.
# Paper-level parameters are marked [PAPER]; their defaults are PLACEHOLDERS
# chosen for a time-compressed laptop testbed, not justified values.
# All durations are in seconds unless the key name says otherwise.

experiment:
  horizon_seconds: 1200          # [PAPER] T_H, observation horizon per run
  warmup_seconds: 90             # stable-only baseline period before rollout starts (load is running)
  trials: 3                      # trials per main-matrix cell
  base_seed: 42                  # evaluation seed of trial t is base_seed + t
  strategies: [manual, static, dbrcl]
  fault_stage_weight: 0.05       # inject when the router reaches this weight
  fault_delay_seconds: 30        # ...and this long after reaching it

# A scenario is a (fault, load) pair; fault "none" is a healthy release.
scenarios:
  mem_leak:           {fault: mem_leak,           load: steady, class: operational}
  latency_regression: {fault: latency_regression, load: steady, class: operational}
  error_burst:        {fault: error_burst,        load: steady, class: operational}
  unexpected_egress:  {fault: unexpected_egress,  load: steady, class: security}
  cpu_saturation:     {fault: cpu_saturation,     load: steady, class: operational}
  dependency_failure: {fault: dependency_failure, load: steady, class: operational}
  healthy_steady:     {fault: none,               load: steady, class: none}
  healthy_spike:      {fault: none,               load: spike,  class: none}

matrix:
  main:                          # strategies x scenarios x experiment.trials
    scenarios: [mem_leak, latency_regression, error_burst, unexpected_egress, healthy_spike]
  demo:                          # strategies x scenarios x 1
    scenarios: [cpu_saturation, dependency_failure]
    trials: 1

calibration:                     # make calibrate: healthy releases only
  seeds: [9001, 9002, 9003]      # must be disjoint from evaluation seeds
  scenarios: [healthy_steady, healthy_spike]
  kappa_margin: 1.2              # kappa = margin * max_k(w_k * r_k)
  output: config/calibrated.yaml # read by evaluation runs if present

cluster:                         # make cluster-up reads MINIKUBE_CPUS / MINIKUBE_MEMORY (defaults below)
  cpus: 4
  memory_mb: 8192
  cni: calico
  driver: docker
  namespace: dbrcl
  sink_namespace: sink

stages:
  weights: [0.01, 0.05, 0.25, 1.0]       # [PAPER] w_k
  min_dwell_seconds: [120, 120, 120, 120] # [PAPER] dwell per stage (time-compressed)

controller:
  step_seconds: 10
  window_seconds: 60             # sliding telemetry window
  post_check_seconds: 60         # post-rollback health check length (t_r)
  max_rollout_seconds: 480       # [PAPER] T_max (= sum of stage dwells at the defaults)
  prometheus_url: http://prometheus-server.monitoring.svc.cluster.local
  router_url: http://router.dbrcl.svc.cluster.local:8080
  stale_sample_seconds: 30       # older samples count as a telemetry gap

slo:
  latency_ms: 300
  error_rate: 0.01

static:                          # Argo/Flagger-style fixed thresholds, canary absolute
  failure_limit: 3
  error_rate: 0.01
  p99_ms: 500
  memory_fraction: 0.85
  cpu_fraction: 0.90

manual:                          # simulated reviewer, a MODELING ASSUMPTION
  review_interval_seconds: 300   # [PAPER] reviewer interval
  action_delay_seconds: 180      # decision + execution time after flagging
  error_ratio_vs_stable: 2.0
  error_rate_min: 0.02
  p99_ratio_vs_stable: 2.0
  memory_fraction: 0.95
  flag_on_sink_connections: true

forecast:
  trend: add
  seasonal: add                  # add | none
  seasonal_period_seconds: 600
  history_seconds: 1200          # stable history used for the fit
  score_threshold_sigma: 3.0

exhaustion:
  samples: 30                    # Theil-Sen window (samples at step_seconds)
  tte_horizon_seconds: 600
  include_cpu: true

iforest:
  quantile: 0.995
  n_estimators: 100
  rolling_window_samples: 360
  model_path: controller/models/iforest.joblib  # optional, from `make calibrate`

fusion:
  alpha: 0.3                     # EWMA smoothing
  throttle_fraction: 0.7
  kappa: 0.05                    # [PAPER] starting value; theta_rb_k = min(theta_max, kappa / w_k).
                                 #   Replaced by config/calibrated.yaml (make calibrate) when present.
  theta_max: 0.8                 # [PAPER]
  epsilon: 0.05                  # [PAPER]
  weights:
    forecast: 1.0
    exhaustion: 1.0
    iforest: 1.0

security:
  source: auto                   # auto = tetragon if BTF is present in the minikube node,
                                 #   else sink_fallback (no prompt); or force tetragon | sink_fallback
  egress_allowlist:
    - payment.dbrcl.svc.cluster.local:8080
    - kube-dns.kube-system.svc.cluster.local:53
    - prometheus-server.monitoring.svc.cluster.local:80
  exec_allowlist:
    - /app/checkout

load:
  uid_pool: 10000
  duration_seconds: 1200         # = experiment.horizon_seconds
  steady:
    rps: 50
  diurnal:
    min_rps: 25
    max_rps: 75
    period_seconds: 600
  spike:
    base_rps: 50
    factor: 4
    duration_seconds: 180
    offset_seconds: 300          # from load start; lands in stages 2-3 of a healthy rollout

services:
  payment:
    latency_ms: 20
    jitter_ms: 5
  checkout:
    memory_limit: 256Mi
    cpu_limit: 500m

faults:                          # default params per fault
  mem_leak:           {target_fraction: 0.9, tau_seconds: 300}
  cpu_saturation:     {workers: 2, duty: 0.9}
  latency_regression: {median_ms: 250, sigma: 0.5}
  dependency_failure: {p: 0.3, mode: error}
  error_burst:        {p: 0.3}
  unexpected_egress:  {p: 0.2, extra_ports: []}

analysis:
  stats: [mean, std, min, max]   # n=3 per cell: no confidence intervals
  figure_width_in: 3.5           # IEEE single column
  figure_formats: [pdf, png]
